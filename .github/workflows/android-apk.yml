name: Android APK

# Builds an installable Android APK on GitHub's runners, with no Expo account.
#
# It runs on pushes to the branch below (a commit message with [skip ci] skips
# it) and from the Actions tab once the workflow is on the default branch.
#
# Signing
#   With the two secrets below set, the APK is signed with your own key and
#   published as a GitHub Release (storyteller-<run number>), so you get one
#   download link and later builds install over earlier ones.
#     STORYTELLER_KEYSTORE_B64   the keystore file, base64 encoded
#     STORYTELLER_KEYSTORE_PASS  the keystore and key password
#   Without them the APK is signed with Expo's public debug key and only
#   attached to the run as an artifact. An app signed with the debug key cannot
#   be updated by one signed with your key: you would have to uninstall first.
on:
  workflow_dispatch:
  push:
    branches: [claude/admiring-fermat-g4o3nd]
    paths:
      - "applications/mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # "preview" is a standalone app (JavaScript bundled in, no dev server).
      APP_VARIANT: preview
      ANDROID_PACKAGE: com.christingeorge.storyteller
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
      EXPO_NO_TELEMETRY: "1"
      HAVE_KEY: ${{ secrets.STORYTELLER_KEYSTORE_B64 != '' && secrets.STORYTELLER_KEYSTORE_PASS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Enable Yarn
        run: corepack enable

      # Same steps as .eas/build/android-build.yml, which EAS runs for cloud builds.
      - name: Pre-install patch of the mobile package manifest
        working-directory: applications/mobile
        run: ./scripts/pre-install.mjs

      - name: Install
        run: yarn workspaces focus @storyteller-platform/mobile

      - name: Prebuild
        run: yarn workspace @storyteller-platform/mobile expo prebuild -p android

      - name: Use your signing key
        if: env.HAVE_KEY == 'true'
        working-directory: applications/mobile
        env:
          KEYSTORE_B64: ${{ secrets.STORYTELLER_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.STORYTELLER_KEYSTORE_PASS }}
        run: |
          KS="$RUNNER_TEMP/storyteller.keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$KS"

          # Check the key now, so a wrong password or alias fails in seconds
          # instead of after the 30 minute compile. The alias is read from the
          # keystore itself, so it does not have to be called "storyteller".
          echo "Keystore file is $(stat -c %s "$KS") bytes"
          LIST=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASS" 2>&1 || true)
          ALIAS=$(echo "$LIST" | awk -F, '/PrivateKeyEntry/ {print $1; exit}')
          if [ -z "$ALIAS" ]; then
            # keytool's own message never contains the password.
            echo "::error::Could not use the keystore. keytool said: $(echo "$LIST" | grep -iE 'error|exception|incorrect|invalid|tampered' | head -2 | tr '\n' ' ')"
            echo "::error::If it says the password was incorrect, STORYTELLER_KEYSTORE_PASS is wrong. If it says the format is invalid, STORYTELLER_KEYSTORE_B64 was not copied whole."
            exit 1
          fi
          # Sign a tiny file with the key, the way the build will, so a wrong key
          # password shows up now and not after the compile.
          (cd "$RUNNER_TEMP" && echo test > signing-test.txt && jar cf signing-test.jar signing-test.txt)
          if ! SIGN_OUT=$(jarsigner -keystore "$KS" -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" "$RUNNER_TEMP/signing-test.jar" "$ALIAS" 2>&1); then
            echo "::error::Signing a test file with the key '$ALIAS' failed: $(echo "$SIGN_OUT" | grep -iE 'error|exception|incorrect|cannot' | head -2 | tr '\n' ' ')"
            exit 1
          fi
          echo "Using the key '$ALIAS'"

          python3 scripts/sign-android-release.py android/app/build.gradle
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: No signing key
        if: env.HAVE_KEY != 'true'
        run: echo "::warning::No signing secrets found. Building with the public debug key; this APK cannot be updated by a later one signed with your key."

      # arm64-v8a is every current phone; building one chip type instead of
      # four makes the native compile a lot faster.
      - name: Build APK
        working-directory: applications/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp applications/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/Storyteller-${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: storyteller-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish a Release
        if: env.HAVE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "storyteller-${{ github.run_number }}" "dist/Storyteller-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Storyteller build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }} on ${{ github.ref_name }}." \
            --prerelease
