name: Android APK

# Builds an installable Android APK on GitHub's runners, with no Expo account.
# It runs on every push to the branch below, and from the Actions tab once it
# is on the default branch. The APK is attached to the run under "Artifacts". It is signed with Expo's default debug key, which is fine
# for installing on your own phone but not for the Play Store.
on:
  workflow_dispatch:
  push:
    branches: [claude/admiring-fermat-g4o3nd]
    paths:
      - "applications/mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # "preview" is a standalone app (JavaScript bundled in, no dev server).
      APP_VARIANT: preview
      # Installs next to the official app. Change it if you like.
      ANDROID_PACKAGE: com.christingeorge.storyteller
      # The lockfile is not changed by this build, but the mobile manifest is
      # edited below, so do not insist on a frozen lockfile.
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Enable Yarn
        run: corepack enable

      # Same steps as .eas/build/android-build.yml, which EAS runs for cloud builds.
      - name: Pre-install patch of the mobile package manifest
        working-directory: applications/mobile
        run: ./scripts/pre-install.mjs

      - name: Install
        run: yarn workspaces focus @storyteller-platform/mobile

      - name: Prebuild
        run: yarn workspace @storyteller-platform/mobile expo prebuild -p android

      - name: Build APK
        working-directory: applications/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: storyteller-apk
          path: applications/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
