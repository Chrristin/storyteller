name: Server image

# Builds the Storyteller server from this fork as a Docker image and publishes
# it to your GitHub container registry: ghcr.io/chrristin/storyteller
#
# It does NOT run on ordinary pushes. It starts only when a tag beginning with
# "server-" is pushed, or when a branch named "server-image" is created or
# pushed. Nothing is deployed anywhere: your server keeps running its current
# image until you change it yourself.
on:
  push:
    tags: ["server-*"]
    branches: ["server-image"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The server needs a prebuilt native library (libraries/align/prebuilds),
      # which this repo keeps in Git LFS. Checkout leaves LFS files as stubs, so
      # fetch only that library. Without it the Docker build tries to compile it
      # from sources that are not in the image yet and fails.
      - name: Fetch the prebuilt native library
        run: |
          git lfs install --local
          git lfs pull --include="libraries/align/prebuilds/linux-x64/**"
          ls -la libraries/align/prebuilds/linux-x64
          test -s libraries/align/prebuilds/linux-x64/*.node

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only. If your NAS is ARM, say so and this gets linux/arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/chrristin/storyteller:${{ github.ref_type == 'tag' && github.ref_name || format('server-{0}', github.run_number) }}
            ghcr.io/chrristin/storyteller:fork-latest
